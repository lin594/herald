# Copy to deploy/docker/docker-compose.override.yml (the ./herald wrapper merges
# it automatically) and adapt. That file is machine-local; keep it out of git.
#
# Rules:
#   - one explicit bind per watched repository, ALWAYS :ro
#   - never mount ~ or /Users wholesale
#   - the container paths here must match the `path` fields in HERALD_WORKSPACES
#
# Example:
#   services:
#     agent-notify:
#       environment:
#         HERALD_TRANSCRIPT_DIR: /host/.codex/sessions
#         HERALD_WORKSPACES: >-
#           [{"name":"herald","path":"/work/herald",
#             "project":"Herald","artifacts":["*.pdf","*.mp3"]}]
#       volumes:
#         - ~/.codex/sessions:/host/.codex/sessions:ro
#         - /Users/YOU/workspace/lin594/herald:/work/herald:ro
