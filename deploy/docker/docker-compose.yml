name: herald
services:
  agent-notify:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        # Optional npm registry mirror for flaky networks, e.g. https://registry.npmmirror.com
        NPM_REGISTRY: "${NPM_REGISTRY:-}"
    ports:
      # Loopback-only: the API must not be reachable from the LAN.
      - "127.0.0.1:8787:8787"
    environment:
      AGENT_NOTIFY_HOST: "0.0.0.0"
      AGENT_NOTIFY_PORT: "8787"
      AGENT_NOTIFY_TOKENS: "${AGENT_NOTIFY_TOKENS}"
      AGENT_NOTIFY_PROVIDER: "${AGENT_NOTIFY_PROVIDER:-bark}"
      AGENT_NOTIFY_LANGUAGE: "${AGENT_NOTIFY_LANGUAGE:-en}"
      BARK_ENDPOINT: "${BARK_ENDPOINT}"
      NTFY_ENDPOINT: "${NTFY_ENDPOINT:-}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
      AGENT_NOTIFY_CLAUDE_COMPLETION_MIN_SECONDS: "${AGENT_NOTIFY_CLAUDE_COMPLETION_MIN_SECONDS:-120}"
      AGENT_NOTIFY_CODEX_COMPLETION_MIN_SECONDS: "${AGENT_NOTIFY_CODEX_COMPLETION_MIN_SECONDS:-120}"
      AGENT_NOTIFY_OPENCODE_COMPLETION_MIN_SECONDS: "${AGENT_NOTIFY_OPENCODE_COMPLETION_MIN_SECONDS:-120}"
      AGENT_NOTIFY_COOLDOWN_SECONDS: "${AGENT_NOTIFY_COOLDOWN_SECONDS:-60}"
      AGENT_NOTIFY_LOG_PATH: "/data/events.jsonl"
      AGENT_NOTIFY_LOG_RAW: "${AGENT_NOTIFY_LOG_RAW:-false}"
      # ── Herald ──
      HERALD_ENABLED: "${HERALD_ENABLED:-true}"
      HERALD_DB_PATH: "/data/monitor.sqlite3"
      HERALD_TICK_SECONDS: "${HERALD_TICK_SECONDS:-15}"
      HERALD_HEARTBEAT_FIRST_SECONDS: "${HERALD_HEARTBEAT_FIRST_SECONDS:-900}"
      HERALD_HEARTBEAT_NORMAL_SECONDS: "${HERALD_HEARTBEAT_NORMAL_SECONDS:-1800}"
      HERALD_QUIET_SECONDS: "${HERALD_QUIET_SECONDS:-600}"
      HERALD_STALL_SECONDS: "${HERALD_STALL_SECONDS:-1500}"
      HERALD_HEARTBEAT_MAX_PER_HOUR: "${HERALD_HEARTBEAT_MAX_PER_HOUR:-3}"
      HERALD_HOST_HEARTBEAT_TIMEOUT_SECONDS: "${HERALD_HOST_HEARTBEAT_TIMEOUT_SECONDS:-180}"
      HERALD_WATCH_INTERVAL_SECONDS: "${HERALD_WATCH_INTERVAL_SECONDS:-30}"
      HERALD_GIT_SCAN_INTERVAL_SECONDS: "${HERALD_GIT_SCAN_INTERVAL_SECONDS:-60}"
      HERALD_SCAN_MAX_FILES: "${HERALD_SCAN_MAX_FILES:-5000}"
      HERALD_MAX_BODY_CHARS: "${HERALD_MAX_BODY_CHARS:-1200}"
      HERALD_TRANSCRIPT_DIR: "${HERALD_TRANSCRIPT_DIR:-}"
      HERALD_QODER_DIR: "${HERALD_QODER_DIR:-}"
      HERALD_WORKSPACES: "${HERALD_WORKSPACES:-}"
      HERALD_PROJECT_MAP: "${HERALD_PROJECT_MAP:-}"
    volumes:
      - agent-notify-data:/data
      # Optional read-only host mounts. Unset variables fall back to a local
      # placeholder directory, so the container still starts with no host
      # exposure. NEVER mount ~ or /Users wholesale — one explicit path each.
      # Codex rollout transcripts (activity observation channel):
      #   HERALD_HOST_CODEX_SESSIONS_DIR=~/.codex/sessions  HERALD_TRANSCRIPT_DIR=/host/.codex/sessions
      - "${HERALD_HOST_CODEX_SESSIONS_DIR:-./unused-mount}:/host/.codex/sessions:ro"
      # Qoder session transcripts (same channel for the Qoder IDE/CLI):
      #   HERALD_HOST_QODER_PROJECTS_DIR=~/.qoder/projects  HERALD_QODER_DIR=/host/.qoder/projects
      - "${HERALD_HOST_QODER_PROJECTS_DIR:-./unused-mount}:/host/.qoder/projects:ro"
      # Workspace mounts belong in docker-compose.override.yml (merged automatically
      # by the ./herald wrapper), one explicit `:ro` bind per watched repository, e.g.
      #   volumes:
      #     agent-notify:
      #       - ~/workspace/lin594/my-repo:/work/my-repo:ro
      # See docker-compose.override.example.yml for a full copy-paste template.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agent-notify-data:
