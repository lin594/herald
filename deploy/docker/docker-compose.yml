name: codex-bark-monitor
services:
  agent-notify:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        # Optional npm registry mirror for flaky networks, e.g. https://registry.npmmirror.com
        NPM_REGISTRY: "${NPM_REGISTRY:-}"
    ports:
      # Loopback-only: the API must not be reachable from the LAN.
      - "127.0.0.1:8787:8787"
    environment:
      AGENT_NOTIFY_HOST: "0.0.0.0"
      AGENT_NOTIFY_PORT: "8787"
      AGENT_NOTIFY_TOKENS: "${AGENT_NOTIFY_TOKENS}"
      AGENT_NOTIFY_PROVIDER: "${AGENT_NOTIFY_PROVIDER:-bark}"
      AGENT_NOTIFY_LANGUAGE: "${AGENT_NOTIFY_LANGUAGE:-en}"
      BARK_ENDPOINT: "${BARK_ENDPOINT}"
      NTFY_ENDPOINT: "${NTFY_ENDPOINT:-}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
      AGENT_NOTIFY_CLAUDE_COMPLETION_MIN_SECONDS: "${AGENT_NOTIFY_CLAUDE_COMPLETION_MIN_SECONDS:-120}"
      AGENT_NOTIFY_CODEX_COMPLETION_MIN_SECONDS: "${AGENT_NOTIFY_CODEX_COMPLETION_MIN_SECONDS:-120}"
      AGENT_NOTIFY_OPENCODE_COMPLETION_MIN_SECONDS: "${AGENT_NOTIFY_OPENCODE_COMPLETION_MIN_SECONDS:-120}"
      AGENT_NOTIFY_COOLDOWN_SECONDS: "${AGENT_NOTIFY_COOLDOWN_SECONDS:-60}"
      AGENT_NOTIFY_LOG_PATH: "/data/events.jsonl"
      AGENT_NOTIFY_LOG_RAW: "${AGENT_NOTIFY_LOG_RAW:-false}"
      # ── Codex Bark Monitor (CBM) ──
      CBM_ENABLED: "${CBM_ENABLED:-true}"
      CBM_DB_PATH: "/data/monitor.sqlite3"
      CBM_TICK_SECONDS: "${CBM_TICK_SECONDS:-15}"
      CBM_HEARTBEAT_FIRST_SECONDS: "${CBM_HEARTBEAT_FIRST_SECONDS:-900}"
      CBM_HEARTBEAT_NORMAL_SECONDS: "${CBM_HEARTBEAT_NORMAL_SECONDS:-1800}"
      CBM_QUIET_SECONDS: "${CBM_QUIET_SECONDS:-600}"
      CBM_STALL_SECONDS: "${CBM_STALL_SECONDS:-1500}"
      CBM_HEARTBEAT_MAX_PER_HOUR: "${CBM_HEARTBEAT_MAX_PER_HOUR:-3}"
      CBM_HOST_HEARTBEAT_TIMEOUT_SECONDS: "${CBM_HOST_HEARTBEAT_TIMEOUT_SECONDS:-180}"
      CBM_WATCH_INTERVAL_SECONDS: "${CBM_WATCH_INTERVAL_SECONDS:-30}"
      CBM_GIT_SCAN_INTERVAL_SECONDS: "${CBM_GIT_SCAN_INTERVAL_SECONDS:-60}"
      CBM_SCAN_MAX_FILES: "${CBM_SCAN_MAX_FILES:-5000}"
      CBM_MAX_BODY_CHARS: "${CBM_MAX_BODY_CHARS:-1200}"
      CBM_TRANSCRIPT_DIR: "${CBM_TRANSCRIPT_DIR:-}"
      CBM_WORKSPACES: "${CBM_WORKSPACES:-}"
      CBM_PROJECT_MAP: "${CBM_PROJECT_MAP:-}"
    volumes:
      - agent-notify-data:/data
      # Optional read-only host mounts. Unset variables fall back to a local
      # placeholder directory, so the container still starts with no host
      # exposure. NEVER mount ~ or /Users wholesale — one explicit path each.
      # Codex rollout transcripts (activity observation channel):
      #   CBM_HOST_CODEX_SESSIONS_DIR=~/.codex/sessions  CBM_TRANSCRIPT_DIR=/host/.codex/sessions
      - "${CBM_HOST_CODEX_SESSIONS_DIR:-./unused-mount}:/host/.codex/sessions:ro"
      # Workspace mounts belong in docker-compose.override.yml (auto-loaded),
      # one explicit `:ro` bind per watched repository, e.g.
      #   volumes:
      #     agent-notify:
      #       - ~/workspace/lin594/my-repo:/work/my-repo:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agent-notify-data:
